name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out submodules
        shell: bash
        run: |
          git submodule sync --recursive
          for attempt in 1 2 3; do
            git submodule update --init --recursive && exit 0
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep 15
          done

      - name: Install C++23 compiler
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes g++-14
            echo "CC=gcc-14" >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          else
            brew install gcc
            compiler=$(find "$(brew --prefix gcc)/bin" -name 'g++-*' -type f | sort -V | tail -n 1)
            echo "CC=${compiler/g++/gcc}" >> "$GITHUB_ENV"
            echo "CXX=$compiler" >> "$GITHUB_ENV"
          fi

      - name: Configure
        shell: bash
        run: >-
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_NATIVE_FLAGS=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 2

      - name: Test
        shell: bash
        run: ctest --test-dir build --build-config Release --output-on-failure

  build-and-test-windows:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja

      - name: Check out submodules
        shell: 'msys2 {0}'
        run: |
          git submodule sync --recursive
          for attempt in 1 2 3; do
            git submodule update --init --recursive && exit 0
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep 15
          done

      - name: Configure
        shell: 'msys2 {0}'
        run: >-
          cmake
          -S .
          -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_NATIVE_FLAGS=OFF

      - name: Build
        shell: 'msys2 {0}'
        run: cmake --build build --config Release --parallel 2

      - name: Test
        shell: 'msys2 {0}'
        run: ctest --test-dir build --build-config Release --output-on-failure
